[package]
name = "zerv"
version = "0.0.0" # Use git tag
authors = ["Wisaroot Lertthaweedech <wislertth@gmail.com>"]
edition = "2024"
description = "Dynamic versioning from git. Every commit gets its version. Keep semantic-release on main. Let zerv prerelease every other branch."
license = "Apache-2.0"
repository = "https://github.com/wislertt/zerv"
homepage = "https://github.com/wislertt/zerv"
readme = "README.md"
keywords = ["cli", "git", "semver", "versioning"]
categories = [
    "command-line-utilities",
    "config",
    "development-tools::build-utils",
    "parsing",
]
rust-version = "1.92"
exclude = ["/.amazonq/", "/.cursor/", "/.dev/", "/.github/", "/scripts/"]

# assets are bare binaries at the versionless name the default pkg-url already probes
[package.metadata.binstall]
pkg-fmt = "bin"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "zerv"
path = "src/main.rs"

[features]
default = []
test-utils = ["tempfile"]
python = ["dep:pyo3"]

[dependencies]
chrono = "^0.4.41"
clap = { version = "^4.5", features = ["derive"] }
indexmap = { version = "^2.14", features = ["serde"] }
libc = "^0.2"
once_cell = "^1.19"
pyo3 = { version = "^0.29", features = ["extension-module"], optional = true }
regex = "^1.12"
ron = "^0.12.0"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
strum = { version = "^0.28.0", features = ["derive"] }
tempfile = { version = "^3.0", optional = true }
tera = { version = "^2.0.0", default-features = false }
toml = "^1.1"
tracing = "^0.1"
tracing-subscriber = { version = "^0.3", features = ["env-filter"] }

[dev-dependencies]
ctor = "^1.0"
dotenvy = "^0.15"
rstest = "^0.26.0"
serial_test = "^4.0"
shlex = "^2.0"
tempfile = "^3.0"
zerv = { path = ".", features = ["test-utils"] }
