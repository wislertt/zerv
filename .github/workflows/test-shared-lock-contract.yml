name: test-shared-lock-contract

# Cross-repo contract test for shared-lock.yml. Runs a lock round-trip inside
# wislertt/zerv-sandbox against THIS ref, so a caller-visible regression (input
# semantics, reentrancy, output shape) fails CI here before callers find it in
# production (as happened with the #297 poll rewrite).
#
# Mechanics: reusable-workflow `uses` does not accept expressions, so the
# sandbox workflow pins `wislertt/zerv/.github/workflows/shared-lock.yml@contract-under-test`
# statically and this workflow moves that branch to the commit under test
# before dispatching. jobs.<job_id>.concurrency serializes runs so two CI runs
# cannot race the branch move.
#
# Sandbox ref namespace: the harness lives on the dedicated branch
# `zerv-ci/lock-contract` (workflow_dispatch works on any ref the workflow
# file exists on), never on main — the semantic-release harness owns main and
# force-pushes fixture history onto it on every run. Each contract run re-pushes
# the harness from .github/fixtures/zerv-sandbox/ before dispatching, so the
# sandbox self-heals after any wipe (the semantic-release harness resets main
# to an empty tree; that used to break this job with a 422).
#
# Requires the ZERV_SANDBOX_REPO_TOKEN secret: fine-grained PAT on
# wislertt/zerv-sandbox with Contents:RW + Actions:RW (Actions needed to
# dispatch and read the sandbox workflow run).

on:
    workflow_call:
        secrets:
            ZERV_SANDBOX_REPO_TOKEN:
                required: false
                description: Fine-grained PAT with Contents:RW + Actions:RW on wislertt/zerv-sandbox

permissions:
    contents: write

env:
    FIXTURES_REPO: wislertt/zerv-sandbox
    WORKFLOW: zerv-lock-contract.yml
    HARNESS_SRC: .github/fixtures/zerv-sandbox/zerv-lock-contract.yml
    HARNESS_PATH: .github/workflows/zerv-lock-contract.yml
    HARNESS_REF: zerv-ci/lock-contract
    CONTRACT_REF: contract-under-test

concurrency:
    group: test-shared-lock-contract
    cancel-in-progress: false

jobs:
    contract:
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: ensure-harness-branch
              env:
                  GH_TOKEN: ${{ secrets.ZERV_SANDBOX_REPO_TOKEN }}
              run: |
                  # Re-push the harness onto its dedicated branch on every run:
                  # single source of truth is .github/fixtures/zerv-sandbox/, and
                  # a wiped sandbox heals itself here instead of failing with a
                  # 422. Specifying branch=<HARNESS_REF> on the contents API
                  # creates the branch from the default branch when missing.
                  if [ -z "$GH_TOKEN" ]; then
                      echo "::error::ZERV_SANDBOX_REPO_TOKEN secret is not set. Create a fine-grained PAT with Contents:RW + Actions:RW on ${FIXTURES_REPO}, then add it as a repository secret."
                      exit 1
                  fi
                  CONTENT=$(base64 -w0 "${GITHUB_WORKSPACE}/${HARNESS_SRC}")
                  FILE_SHA=$(gh api "repos/${FIXTURES_REPO}/contents/${HARNESS_PATH}?ref=${HARNESS_REF}" --jq .sha 2>/dev/null || true)
                  ARGS=(-f message="ci: contract harness update" -f content="$CONTENT" -f branch="${HARNESS_REF}")
                  if [ -n "$FILE_SHA" ]; then
                      ARGS+=(-f sha="$FILE_SHA")
                  fi
                  gh api -X PUT "repos/${FIXTURES_REPO}/contents/${HARNESS_PATH}" "${ARGS[@]}" --jq .commit.sha
                  echo "harness on ${HARNESS_REF} at zerv@${{ github.sha }}"

            - name: move-contract-ref
              env:
                  GH_TOKEN: ${{ github.token }}
                  CONTRACT_REF: ${{ env.CONTRACT_REF }}
              run: |
                  # Point the sandbox's static pin at this exact commit.
                  if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${CONTRACT_REF}" > /dev/null 2>&1; then
                      gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/${CONTRACT_REF}" \
                          -f sha="${{ github.sha }}" -F force=true > /dev/null
                  else
                      gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                          -f ref="refs/heads/${CONTRACT_REF}" -f sha="${{ github.sha }}" > /dev/null
                  fi
                  echo "contract-under-test -> ${{ github.sha }}"

            - name: dispatch-sandbox-contract-run
              env:
                  GH_TOKEN: ${{ secrets.ZERV_SANDBOX_REPO_TOKEN }}
              run: |
                  if [ -z "$GH_TOKEN" ]; then
                      echo "::error::ZERV_SANDBOX_REPO_TOKEN secret is not set. Create a fine-grained PAT with Contents:RW + Actions:RW on ${FIXTURES_REPO}, then add it as a repository secret."
                      exit 1
                  fi
                  # Retry: right after the harness commit lands, GitHub can lag
                  # registering the workflow on the new ref (422).
                  for _ in $(seq 1 6); do
                      if gh workflow run --repo "$FIXTURES_REPO" "$WORKFLOW" --ref "$HARNESS_REF" 2>/tmp/dispatch.err; then
                          exit 0
                      fi
                      sleep 5
                  done
                  cat /tmp/dispatch.err >&2
                  exit 1

            - name: wait-for-contract-run
              env:
                  GH_TOKEN: ${{ secrets.ZERV_SANDBOX_REPO_TOKEN }}
              run: |
                  # The contract job above serializes contract runs, so the newest
                  # run of this workflow is ours.
                  rid=""
                  for _ in $(seq 1 12); do
                      sleep 10
                      rid=$(gh run list --repo "$FIXTURES_REPO" --workflow "$WORKFLOW" \
                          --json databaseId -q '.[0].databaseId' 2>/dev/null | head -1)
                      [ -n "$rid" ] && break
                  done
                  if [ -z "$rid" ]; then
                      echo "::error::sandbox contract run not found after dispatch"
                      exit 1
                  fi
                  echo "Sandbox contract run: https://github.com/${FIXTURES_REPO}/actions/runs/${rid}"
                  conc=""
                  for _ in $(seq 1 90); do
                      st=$(gh run view "$rid" --repo "$FIXTURES_REPO" --json status -q .status)
                      if [ "$st" = "completed" ]; then
                          conc=$(gh run view "$rid" --repo "$FIXTURES_REPO" --json conclusion -q .conclusion)
                          break
                      fi
                      sleep 10
                  done
                  if [ "$conc" != "success" ]; then
                      echo "::error::sandbox lock contract failed (conclusion: ${conc:-timeout}). Run: https://github.com/${FIXTURES_REPO}/actions/runs/${rid}"
                      exit 1
                  fi
                  echo "Sandbox lock contract passed for zerv@${{ github.sha }}"
