name: publish-python-package

on:
    workflow_call:
        inputs:
            version:
                required: true
                type: string
                description: "PEP440 version string"
            registry:
                required: false
                type: string
                description: "Publish index (pypi or test-pypi)"
                default: "test-pypi"
            python_version:
                required: false
                type: string
                description: "Python version"
                default: "3.14"
        secrets:
            PYPI_API_TOKEN:
                required: true

jobs:
    publish-pypi:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-24.04
                      target: x86_64-unknown-linux-gnu
                    - os: ubuntu-24.04
                      target: aarch64-unknown-linux-gnu
                    - os: ubuntu-24.04
                      target: x86_64-unknown-linux-musl
                    - os: ubuntu-24.04
                      target: aarch64-unknown-linux-musl
                    - os: macos-latest
                      target: aarch64-apple-darwin
                    - os: macos-latest
                      target: x86_64-apple-darwin
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                    - os: windows-latest
                      target: aarch64-pc-windows-msvc

        steps:
            - name: checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: setup-mise
              uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

            - name: verify-rust-toolchain
              # Workaround for Windows rustup bug: https://github.com/rust-lang/rustup/issues/3104
              shell: bash
              run: |
                  if ! cargo --version &>/dev/null; then
                    TOOLCHAIN=$(rustup show active-toolchain | head -1 | cut -d' ' -f1)
                    rustup toolchain uninstall "$TOOLCHAIN" || true
                    rustup toolchain install "$TOOLCHAIN" --no-self-update
                  fi
                  cargo --version

            - name: cache-publish
              env:
                  CACHE_KEY_PREFIX: publish-${{ github.workflow }}-${{ github.job }}-${{ runner.os }}-${{ matrix.target }}
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cargo/bin/
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                      ${{ github.workspace }}/target/
                  key: ${{ env.CACHE_KEY_PREFIX }}-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: |
                      ${{ env.CACHE_KEY_PREFIX }}-${{ github.run_id }}-
                      ${{ env.CACHE_KEY_PREFIX }}-

            - name: install-target
              shell: bash
              run: rustup target add ${{ matrix.target }}

            - name: setup-path
              shell: bash
              run: |
                  if [ "$RUNNER_OS" == "Windows" ]; then
                      echo "${{ github.workspace }}/.venv/Scripts" >> "$GITHUB_PATH"
                  else
                      echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"
                  fi

            - name: publish
              shell: bash
              run: |
                  BAKE_PUBLISH_TOKEN=${{ secrets.PYPI_API_TOKEN }} \
                  bake publish \
                      --registry "${{ inputs.registry }}" \
                      --version "${{ inputs.version }}" \
                      --target "${{ matrix.target }}"
