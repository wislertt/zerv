name: ci

on:
    pull_request:
        types: [opened, synchronize, reopened]

# cancelling a run mid-flight strands the lock harness's seeded sandbox locks
concurrency:
    group: ${{ github.workflow }}-caller-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: false

permissions: {}

jobs:
    # ====================================================
    # Versioning and Release
    # ====================================================
    check-pre-release:
        permissions:
            contents: read
            pull-requests: read
        name: check-pre-release
        uses: ./.github/workflows/shared-check-pr-label-and-branch.yml
        with:
            target_label: "pre-release"
            branch_prefixes: '["release/"]'
            branch_names: '["develop"]'

    zerv-versioning:
        permissions:
            contents: read
        name: zerv-versioning
        needs: check-pre-release
        uses: ./.github/workflows/shared-zerv-versioning.yml
        with:
            schema: >-
                ${{ (needs.check-pre-release.outputs.is_valid == 'true'
                && 'standard-base-prerelease-post')
                || 'standard-base-prerelease-post-dev' }}

    tag-pre-release:
        permissions:
            contents: write
        name: tag-pre-release
        needs: [zerv-versioning, check-pre-release]
        if: needs.check-pre-release.outputs.is_valid == 'true'
        uses: ./.github/workflows/shared-create-tags.yml
        with:
            tags: '["${{ fromJson(needs.zerv-versioning.outputs.versions).v_semver }}"]'

    # ====================================================
    # Test and Lint
    # ====================================================
    test:
        permissions:
            contents: read
        uses: ./.github/workflows/test.yml
        secrets:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    pre-commit:
        permissions:
            contents: read
        uses: ./.github/workflows/pre-commit.yml

    build-bin:
        permissions:
            contents: read
        uses: ./.github/workflows/build-bin.yml

    test-shared:
        permissions:
            actions: write
            contents: write
            issues: write
            pull-requests: write
        name: test-shared
        uses: ./.github/workflows/test-shared.yml
        secrets:
            ZERV_SANDBOX_REPO_TOKEN: ${{ secrets.ZERV_SANDBOX_REPO_TOKEN }}

    # ====================================================
    # Deployment with environment
    # ====================================================
    check-deploy-env-labels:
        permissions:
            contents: read
            pull-requests: read
        name: check-deploy-env-labels
        uses: ./.github/workflows/shared-check-pr-labels-with-prefix.yml
        with:
            prefix: "deploy-"

    test-shared-global-lock:
        permissions:
            contents: write
        name: test-shared-global-lock
        needs: check-deploy-env-labels
        uses: ./.github/workflows/test-shared-global-lock.yml
        with:
            deploy_labels: ${{ needs.check-deploy-env-labels.outputs.labels }}
            lock_key_owner: ${{ github.ref }}
            unlock_after_deploy: false
            delay_before_lock_in_sec: 0

    test-shared-service-lock:
        permissions:
            contents: write
        name: test-shared-service-lock
        needs: check-deploy-env-labels
        uses: ./.github/workflows/test-shared-service-lock.yml
        with:
            deploy_labels: ${{ needs.check-deploy-env-labels.outputs.labels }}
            lock_key_owner: ${{ github.ref }}
            unlock_after_deploy: false
            delay_before_lock_in_sec: 0

    # ====================================================
    # Deployment
    # ====================================================
    publish-test-pypi:
        permissions:
            contents: read
        if: needs.check-pre-release.outputs.has_label == 'true'
        needs: [zerv-versioning, check-pre-release]
        uses: ./.github/workflows/publish-pypi.yml
        with:
            version: ${{ fromJson(needs.zerv-versioning.outputs.versions).semver }}
            registry: "test-pypi"
        secrets:
            PYPI_API_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}

    publish-crates-dry-run:
        permissions:
            contents: read
        if: needs.check-pre-release.outputs.has_label == 'true'
        needs: [zerv-versioning, check-pre-release]
        uses: ./.github/workflows/publish-crates.yml
        with:
            version: ${{ fromJson(needs.zerv-versioning.outputs.versions).semver }}
        secrets:
            CRATES_API_TOKEN: "" # dry-run mode
