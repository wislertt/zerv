name: test-shared-lock

# Comprehensive harness for shared-lock.yml poll/wait behavior.
# Deterministic by design: each scenario pre-seeds a lock branch via the
# contents API (github/lock stores locks as branch "<prefix><key>-branch-deploy-lock"
# holding lock.json with reason "owner:<id>") instead of racing two runners.
#
# Scenarios:
#   t1 fail-fast:      lock held, timeout 0            -> lock job must fail
#   t2 wait-then-lock: lock released mid-wait          -> lock job must succeed
#   t3 timeout:        lock held past timeout          -> lock job must fail
#   t4 back-compat:    delay_before_start_in_sec used as timeout -> must fail
#   t5 reentrant:      lock already owned by us        -> lock job must succeed

on:
    workflow_dispatch:
    workflow_call:

permissions:
    contents: write

env:
    KEY_PREFIX: test/
    OWNER_FOREIGN: foreign-owner

jobs:
    # ---------- t1: held lock + timeout 0 -> fail fast ----------
    t1-seed:
        runs-on: ubuntu-latest
        steps:
            - name: seed-lock
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  CONTENT=$(printf '{"reason":"owner:%s","created_by":"shared-lock-test"}' "$OWNER_FOREIGN" | base64 -w0)
                  gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/lock.json" \
                      -f message="seed t1" -f content="$CONTENT" \
                      -f branch="${KEY_PREFIX}slock-t1-branch-deploy-lock" > /dev/null

    t1-lock:
        needs: t1-seed
        uses: ./.github/workflows/shared-lock.yml
        with:
            key: slock-t1
            key_prefix: test/
            key_owner: t1-owner
            job_name: t1-lock
            wait_for_lock_timeout_in_sec: 0

    t1-assert:
        needs: [t1-seed, t1-lock]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: assert
              run: |
                  if [ "${{ needs.t1-lock.result }}" != "failure" ]; then
                      echo "::error::t1 expected failure (fail-fast on held lock), got: ${{ needs.t1-lock.result }}"
                      exit 1
                  fi
            - name: cleanup
              if: always()
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${KEY_PREFIX}slock-t1-branch-deploy-lock" || true

    # ---------- t2: lock released while waiting -> acquire ----------
    t2-seed:
        runs-on: ubuntu-latest
        steps:
            - name: seed-lock
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  CONTENT=$(printf '{"reason":"owner:%s","created_by":"shared-lock-test"}' "$OWNER_FOREIGN" | base64 -w0)
                  gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/lock.json" \
                      -f message="seed t2" -f content="$CONTENT" \
                      -f branch="${KEY_PREFIX}slock-t2-branch-deploy-lock" > /dev/null

    t2-release:
        needs: t2-seed
        runs-on: ubuntu-latest
        steps:
            - name: release-after-delay
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  echo "Releasing seeded lock in 20s..."
                  sleep 20
                  gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${KEY_PREFIX}slock-t2-branch-deploy-lock"

    t2-lock:
        needs: t2-seed
        uses: ./.github/workflows/shared-lock.yml
        with:
            key: slock-t2
            key_prefix: test/
            key_owner: t2-owner
            job_name: t2-lock
            wait_for_lock_timeout_in_sec: 120
            wait_for_lock_poll_interval_in_sec: 5

    t2-assert:
        needs: [t2-seed, t2-release, t2-lock]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: assert
              run: |
                  FAILED=0
                  if [ "${{ needs.t2-release.result }}" != "success" ]; then
                      echo "::error::t2 release job failed: ${{ needs.t2-release.result }}"
                      FAILED=1
                  fi
                  if [ "${{ needs.t2-lock.result }}" != "success" ]; then
                      echo "::error::t2 expected lock success (waited for release), got: ${{ needs.t2-lock.result }}"
                      FAILED=1
                  fi
                  exit $FAILED
            - name: cleanup
              if: always()
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${KEY_PREFIX}slock-t2-branch-deploy-lock" || true

    # ---------- t3: held lock past timeout -> fail ----------
    t3-seed:
        runs-on: ubuntu-latest
        steps:
            - name: seed-lock
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  CONTENT=$(printf '{"reason":"owner:%s","created_by":"shared-lock-test"}' "$OWNER_FOREIGN" | base64 -w0)
                  gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/lock.json" \
                      -f message="seed t3" -f content="$CONTENT" \
                      -f branch="${KEY_PREFIX}slock-t3-branch-deploy-lock" > /dev/null

    t3-lock:
        needs: t3-seed
        uses: ./.github/workflows/shared-lock.yml
        with:
            key: slock-t3
            key_prefix: test/
            key_owner: t3-owner
            job_name: t3-lock
            wait_for_lock_timeout_in_sec: 20
            wait_for_lock_poll_interval_in_sec: 5

    t3-assert:
        needs: [t3-seed, t3-lock]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: assert
              run: |
                  if [ "${{ needs.t3-lock.result }}" != "failure" ]; then
                      echo "::error::t3 expected failure (timeout on held lock), got: ${{ needs.t3-lock.result }}"
                      exit 1
                  fi
            - name: cleanup
              if: always()
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${KEY_PREFIX}slock-t3-branch-deploy-lock" || true

    # ---------- t4: back-compat delay_before_start_in_sec acts as timeout ----------
    t4-seed:
        runs-on: ubuntu-latest
        steps:
            - name: seed-lock
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  CONTENT=$(printf '{"reason":"owner:%s","created_by":"shared-lock-test"}' "$OWNER_FOREIGN" | base64 -w0)
                  gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/lock.json" \
                      -f message="seed t4" -f content="$CONTENT" \
                      -f branch="${KEY_PREFIX}slock-t4-branch-deploy-lock" > /dev/null

    t4-lock:
        needs: t4-seed
        uses: ./.github/workflows/shared-lock.yml
        with:
            key: slock-t4
            key_prefix: test/
            key_owner: t4-owner
            job_name: t4-lock
            delay_before_start_in_sec: 20

    t4-assert:
        needs: [t4-seed, t4-lock]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: assert
              run: |
                  if [ "${{ needs.t4-lock.result }}" != "failure" ]; then
                      echo "::error::t4 expected failure (back-compat timeout on held lock), got: ${{ needs.t4-lock.result }}"
                      exit 1
                  fi
            - name: cleanup
              if: always()
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${KEY_PREFIX}slock-t4-branch-deploy-lock" || true

    # ---------- t5: lock already owned by us -> proceed ----------
    t5-seed:
        runs-on: ubuntu-latest
        steps:
            - name: seed-lock
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  CONTENT=$(printf '{"reason":"owner:%s","created_by":"shared-lock-test"}' "t5-owner" | base64 -w0)
                  gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/lock.json" \
                      -f message="seed t5" -f content="$CONTENT" \
                      -f branch="${KEY_PREFIX}slock-t5-branch-deploy-lock" > /dev/null

    t5-lock:
        needs: t5-seed
        uses: ./.github/workflows/shared-lock.yml
        with:
            key: slock-t5
            key_prefix: test/
            key_owner: t5-owner
            job_name: t5-lock
            wait_for_lock_timeout_in_sec: 0

    t5-assert:
        needs: [t5-seed, t5-lock]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: assert
              run: |
                  if [ "${{ needs.t5-lock.result }}" != "success" ]; then
                      echo "::error::t5 expected success (reentrant lock owned by us), got: ${{ needs.t5-lock.result }}"
                      exit 1
                  fi
            - name: cleanup
              if: always()
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${KEY_PREFIX}slock-t5-branch-deploy-lock" || true

    # ---------- summary ----------
    summary:
        name: test-shared-lock
        needs: [t1-assert, t2-assert, t3-assert, t4-assert, t5-assert]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: report
              run: |
                  FAILED=0
                  for job in t1-assert t2-assert t3-assert t4-assert t5-assert; do
                      RESULT=$(echo "${{ toJson(needs) }}" | jq -r ".\"$job\".result")
                      echo "$job: $RESULT"
                      [ "$RESULT" != "success" ] && FAILED=1
                  done
                  exit $FAILED
