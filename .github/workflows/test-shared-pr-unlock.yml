name: test-shared-pr-unlock

on:
    pull_request:
        types: [closed, unlabeled]

concurrency:
    group: ${{ github.workflow }}-caller-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions: {}

jobs:
    unlock-environments:
        permissions:
            contents: write
        uses: ./.github/workflows/shared-pr-unlock.yml
        with:
            environments: '["d", "n", "p"]'
            deploy_label_prefix: "deploy-"
            key_prefix: test/

    unlock-services:
        permissions:
            contents: write
        uses: ./.github/workflows/shared-pr-unlock.yml
        with:
            environments: '["d", "n", "p"]'
            service_names: '["dummy-service-1", "dummy-service-2"]'
            deploy_label_prefix: "deploy-"
            key_prefix: test/
