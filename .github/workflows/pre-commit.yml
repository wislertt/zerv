name: pre-commit

on:
    workflow_call:
        inputs:
            python_version:
                required: false
                type: string
                default: "3.14"

jobs:
    pre-commit:
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: setup-mise
              uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0

            - name: install-rust-toolchain
              run: rustup toolchain install nightly --component rustfmt --component clippy

            - name: cache-deps
              env:
                  CACHE_KEY_PREFIX: deps-${{ github.workflow }}-${{ github.job }}-${{ runner.os }}-py${{ inputs.python_version }}
                  CACHE_KEY_DEPS: ${{ hashFiles('uv.lock') }}
              uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
              with:
                  path: |
                      ~/.cache/pre-commit
                      ~/.cache/ruff
                      ~/.bun/install/cache
                      ~/.local/share/uv
                      ~/.cache/uv
                      ${{ github.workspace }}/target/
                      ${{ github.workspace }}/.venv
                  key: ${{ env.CACHE_KEY_PREFIX }}-${{ env.CACHE_KEY_DEPS }}-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: |
                      ${{ env.CACHE_KEY_PREFIX }}-${{ env.CACHE_KEY_DEPS }}-${{ github.run_id }}-
                      ${{ env.CACHE_KEY_PREFIX }}-${{ env.CACHE_KEY_DEPS }}-
                      ${{ env.CACHE_KEY_PREFIX }}-

            - name: install-dependencies
              run: uv sync --all-extras --all-groups --frozen

            - name: setup-path
              shell: bash
              run: echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"

            - name: run-pre-commit
              run: uv run pre-commit run --all-files
