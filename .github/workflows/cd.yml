name: cd

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions: {}

# never cancel a release mid-flight; a newer push queues behind it
concurrency:
    group: ${{ github.workflow }}-caller-${{ github.ref }}
    cancel-in-progress: false

jobs:
    # ====================================================
    # Versioning and Release
    # ====================================================
    semantic-release:
        permissions:
            contents: write
            issues: write
            pull-requests: write
        name: semantic-release
        uses: ./.github/workflows/shared-semantic-release.yml
        with:
            allowed_workflow_dispatch_branches: '["main"]'
            fail_on_invalid_workflow_dispatch_ref: true

    zerv-versioning:
        permissions:
            contents: read
        needs: semantic-release
        if: needs.semantic-release.outputs.is_valid_semantic_release == 'true'
        uses: ./.github/workflows/shared-zerv-versioning.yml

    create-version-prefix-tags:
        permissions:
            contents: write
        needs: [semantic-release, zerv-versioning]
        if: needs.semantic-release.outputs.new_release_published == 'true'
        uses: ./.github/workflows/shared-create-tags.yml
        with:
            tags: >-
                [
                  "${{ fromJson(needs.zerv-versioning.outputs.versions).v_major }}",
                  "${{ fromJson(needs.zerv-versioning.outputs.versions).v_major_minor }}"
                ]

    # ====================================================
    # Test and Lint
    # ====================================================
    test:
        permissions:
            contents: read
        uses: ./.github/workflows/test.yml
        secrets:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    pre-commit:
        permissions:
            contents: read
        uses: ./.github/workflows/pre-commit.yml

    test-shared:
        # test-shared-lock.yml dispatches throwaway expected-fail runs, and a
        # reusable workflow cannot exceed the caller's permissions
        permissions:
            actions: write
            contents: write
            issues: write
            pull-requests: write
        name: test-shared
        uses: ./.github/workflows/test-shared.yml
        secrets:
            ZERV_SANDBOX_REPO_TOKEN: ${{ secrets.ZERV_SANDBOX_REPO_TOKEN }}

    # ====================================================
    # Deployment with environment
    # ====================================================
    test-shared-global-lock:
        permissions:
            contents: write
        name: test-shared-global-lock
        uses: ./.github/workflows/test-shared-global-lock.yml
        with:
            deploy_labels: '{"deploy-d": true, "deploy-n": true, "deploy-p": true}'
            lock_key_owner: ${{ github.ref }}
            unlock_after_deploy: true
            delay_before_lock_in_sec: 30

    test-shared-service-lock:
        permissions:
            contents: write
        name: test-shared-service-lock
        uses: ./.github/workflows/test-shared-service-lock.yml
        with:
            deploy_labels: '{"deploy-d": true, "deploy-n": true, "deploy-p": true}'
            lock_key_owner: ${{ github.ref }}
            unlock_after_deploy: true
            delay_before_lock_in_sec: 30

    # ====================================================
    # Deployment without environment
    # ====================================================
    release-bin:
        permissions:
            contents: write
        needs: zerv-versioning
        uses: ./.github/workflows/build-bin.yml
        with:
            version: ${{ fromJson(needs.zerv-versioning.outputs.versions).semver }}
            tag: ${{ fromJson(needs.zerv-versioning.outputs.versions).v_semver }}
            upload_to_release: true

    publish-test-pypi:
        permissions:
            contents: read
        needs: zerv-versioning
        uses: ./.github/workflows/publish-pypi.yml
        with:
            version: ${{ fromJson(needs.zerv-versioning.outputs.versions).semver }}
            registry: "test-pypi"
        secrets:
            PYPI_API_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}

    publish-pypi:
        permissions:
            contents: read
        needs: zerv-versioning
        uses: ./.github/workflows/publish-pypi.yml
        with:
            version: ${{ fromJson(needs.zerv-versioning.outputs.versions).semver }}
            registry: "pypi"
        secrets:
            PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

    publish-crates:
        permissions:
            contents: read
        needs: [zerv-versioning, release-bin]
        uses: ./.github/workflows/publish-crates.yml
        with:
            version: ${{ fromJson(needs.zerv-versioning.outputs.versions).semver }}
        secrets:
            CRATES_API_TOKEN: ${{ secrets.CARGO_TOKEN }}
