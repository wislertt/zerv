name: test

on:
    workflow_call:
        secrets:
            SONAR_TOKEN:
                required: true
            CODECOV_TOKEN:
                required: true

env:
    # Reusable cargo cache paths - available to all jobs
    CARGO_CACHE_PATHS: |
        ~/.cargo/bin/
        ~/.cargo/registry/index/
        ~/.cargo/registry/cache/
        ~/.cargo/git/db/
        ${{ github.workspace }}/target/

jobs:
    rust:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        env:
            ZERV_TEST_NATIVE_GIT: true
            ZERV_TEST_DOCKER: ${{ matrix.os == 'ubuntu-latest' && 'true' || 'false' }}
            ZERV_FORCE_RUST_LOG_OFF: ${{ matrix.os == 'ubuntu-latest' && 'true' || 'false' }}
            PYTHON_VERSION: "3.14"
        steps:
            - name: checkout-repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 0

            - name: set-python-version
              run: echo "${{ env.PYTHON_VERSION }}" > .python-version

            - name: setup-mise
              uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0

            - name: verify-rust-toolchain
              # Workaround for Windows rustup bug: https://github.com/rust-lang/rustup/issues/3104
              shell: bash
              run: |
                  if ! cargo --version &>/dev/null; then
                    TOOLCHAIN=$(rustup show active-toolchain | head -1 | cut -d' ' -f1)
                    rustup toolchain uninstall "$TOOLCHAIN" || true
                    rustup toolchain install "$TOOLCHAIN" --no-self-update
                  fi
                  cargo --version

            - name: restore-cache-cargo
              id: restore-cache-cargo
              env:
                  CACHE_KEY_PREFIX: cargo-${{ github.workflow }}-${{ github.job }}-${{ runner.os }}
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ env.CARGO_CACHE_PATHS }}
                  key: ${{ env.CACHE_KEY_PREFIX }}-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: |
                      ${{ env.CACHE_KEY_PREFIX }}-${{ hashFiles('**/Cargo.lock') }}-
                      ${{ env.CACHE_KEY_PREFIX }}-

            - name: cache-venv
              env:
                  CACHE_KEY_PREFIX: venv-${{ github.workflow }}-${{ github.job }}-${{ runner.os }}-py${{ env.PYTHON_VERSION }}
                  CACHE_KEY_DEPS: ${{ hashFiles('uv.lock') }}
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.local/share/uv
                      ~/.cache/uv
                      ${{ github.workspace }}/.venv
                  key: ${{ env.CACHE_KEY_PREFIX }}-${{ env.CACHE_KEY_DEPS }}-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: |
                      ${{ env.CACHE_KEY_PREFIX }}-${{ env.CACHE_KEY_DEPS }}-${{ github.run_id }}-
                      ${{ env.CACHE_KEY_PREFIX }}-${{ env.CACHE_KEY_DEPS }}-
                      ${{ env.CACHE_KEY_PREFIX }}-

            - name: install-dependencies
              run: uv sync --all-extras --all-groups --frozen

            - name: setup-path
              shell: bash
              run: |
                  if [ "$RUNNER_OS" == "Windows" ]; then
                      echo "${{ github.workspace }}/.venv/Scripts" >> "$GITHUB_PATH"
                  else
                      echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"
                  fi

            - name: run-tests
              run: bake test-rust

            - name: save-cache-cargo
              if: always()
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ env.CARGO_CACHE_PATHS }}
                  key: ${{ steps.restore-cache-cargo.outputs.cache-primary-key }}

            - name: upload-coverage-reports-to-codecov
              if: matrix.os == 'ubuntu-latest'
              uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
              with:
                  fail_ci_if_error: true
                  token: ${{ secrets.CODECOV_TOKEN }}
                  verbose: true

            - name: sonarqube-scan
              if: matrix.os == 'ubuntu-latest'
              uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    python:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                python_version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        runs-on: ${{ matrix.os }}
        steps:
            - name: checkout-repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 0

            - name: restore-cache-cargo
              id: restore-cache-cargo
              env:
                  CACHE_KEY_PREFIX: cargo-${{ github.workflow }}-${{ github.job }}-${{ runner.os }}
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ env.CARGO_CACHE_PATHS }}
                  key: ${{ env.CACHE_KEY_PREFIX }}-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: |
                      ${{ env.CACHE_KEY_PREFIX }}-${{ hashFiles('**/Cargo.lock') }}-
                      ${{ env.CACHE_KEY_PREFIX }}-

            - name: set-python-version
              run: echo "${{ matrix.python_version }}" > .python-version

            - name: setup-mise
              uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0

            - name: verify-rust-toolchain
              # Workaround for Windows rustup bug: https://github.com/rust-lang/rustup/issues/3104
              shell: bash
              run: |
                  if ! cargo --version &>/dev/null; then
                    TOOLCHAIN=$(rustup show active-toolchain | head -1 | cut -d' ' -f1)
                    rustup toolchain uninstall "$TOOLCHAIN" || true
                    rustup toolchain install "$TOOLCHAIN" --no-self-update
                  fi
                  cargo --version

            - name: cache-venv
              env:
                  CACHE_KEY_PREFIX: venv-${{ github.workflow }}-${{ github.job }}-${{ runner.os }}-py${{ matrix.python_version }}
                  CACHE_KEY_DEPS: ${{ hashFiles('uv.lock') }}
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.local/share/uv
                      ~/.cache/uv
                      ${{ github.workspace }}/.venv
                  key: ${{ env.CACHE_KEY_PREFIX }}-${{ env.CACHE_KEY_DEPS }}-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: |
                      ${{ env.CACHE_KEY_PREFIX }}-${{ env.CACHE_KEY_DEPS }}-${{ github.run_id }}-
                      ${{ env.CACHE_KEY_PREFIX }}-${{ env.CACHE_KEY_DEPS }}-
                      ${{ env.CACHE_KEY_PREFIX }}-

            - name: install-dependencies
              shell: bash
              run: |
                  uv sync --all-extras --all-groups --frozen
                  if [ "$RUNNER_OS" == "Windows" ]; then
                      echo "${{ github.workspace }}/.venv/Scripts" >> "$GITHUB_PATH"
                  else
                      echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"
                  fi
                  echo "${{ github.workspace }}/target/release" >> "$GITHUB_PATH"

            - name: run-tests
              run: bake test-python

            - name: save-cache-cargo
              if: always()
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ env.CARGO_CACHE_PATHS }}
                  key: ${{ steps.restore-cache-cargo.outputs.cache-primary-key }}
