# Aggregator: calls the shared-workflow test harnesses that fit GitHub's
# 4-level workflow_call nesting cap when wrapped here
# (ci/cd -> this -> harness -> shared). The global/service lock harnesses
# (test-shared-global-lock / test-shared-service-lock) are NOT called here:
# their chains already reach 4 levels
# (ci/cd -> test-shared-service-lock -> ... -> shared-lock), so wrapping them
# would exceed the cap at runtime ("Workflow execution nesting limit
# exceeded"). ci.yml and cd.yml call those two directly. test-shared-lock
# (poll harness) and test-shared-lock-contract (sandbox) DO fit and run here.
name: test-shared

on:
    workflow_dispatch:
    workflow_call:
        secrets:
            ZERV_SANDBOX_REPO_TOKEN:
                required: false
                description: Fine-grained PAT with Contents:RW on wislertt/zerv-sandbox (fixture repo)

jobs:
    affected-projects:
        name: affected-projects
        uses: ./.github/workflows/test-shared-affected-projects.yml

    semantic-release:
        name: semantic-release
        uses: ./.github/workflows/test-shared-semantic-release.yml
        secrets:
            ZERV_SANDBOX_REPO_TOKEN: ${{ secrets.ZERV_SANDBOX_REPO_TOKEN }}

    check-marker:
        name: check-marker
        uses: ./.github/workflows/test-shared-check-marker.yml

    pr-label-checks:
        name: pr-label-checks
        uses: ./.github/workflows/test-shared-pr-label-checks.yml

    # Poll/wait harness for shared-lock.yml. Chain reaches only 3 levels
    # (ci/cd -> this -> test-shared-lock -> shared-lock), so it fits here -
    # unlike the global/service-lock harnesses, whose chains already reach 4.
    # Keep this wired: the harness was dispatch-only when the #297 poll rewrite
    # shipped, and nothing in CI objected to a caller-breaking change.
    lock-poll:
        name: lock-poll
        uses: ./.github/workflows/test-shared-lock.yml

    # Cross-repo contract test: runs shared-lock round-trip in zerv-sandbox
    # against this ref. Catches caller-visible regressions before callers do.
    lock-contract:
        name: lock-contract
        uses: ./.github/workflows/test-shared-lock-contract.yml
        secrets:
            ZERV_SANDBOX_REPO_TOKEN: ${{ secrets.ZERV_SANDBOX_REPO_TOKEN }}
