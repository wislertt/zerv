# Aggregator: calls the shared-workflow test harnesses that fit GitHub's
# 4-level workflow_call nesting cap when wrapped here
# (ci/cd -> this -> harness -> shared). The global/service lock harnesses
# (test-shared-global-lock / test-shared-service-lock) are NOT called here:
# their chains already reach 4 levels
# (ci/cd -> test-shared-service-lock -> ... -> shared-lock), so wrapping them
# would exceed the cap at runtime ("Workflow execution nesting limit
# exceeded"). ci.yml and cd.yml call those two directly. test-shared-lock
# (poll harness) and test-shared-lock-contract (sandbox) DO fit and run here.
name: test-shared

on:
    workflow_dispatch:
    workflow_call:
        secrets:
            ZERV_SANDBOX_REPO_TOKEN:
                required: false
                description: Fine-grained PAT with Contents:RW on wislertt/zerv-sandbox (fixture repo)

# The poll harness owns fixed sandbox keys (test/slock-t1..t8, qa*, qC*), so
# two simultaneous runs (a second push before the first CI finished, or two
# lock-touching PRs) would contend for the same keys and fail each other.
# Serialize repo-wide. Queued, never cancelled: cancelling mid-run strands
# seeded locks in the sandbox, and the default pending-supersede already
# means only the newest run of a rapid-push series waits in the queue.
concurrency:
    group: test-shared-lock-poll
    cancel-in-progress: false

jobs:
    # The lock harnesses below run real dispatched workflows and cost ~20-40
    # minutes, so they only run when the lock-related workflows changed. PRs
    # diff against the base sha, pushes against event.before; anything else
    # (workflow_dispatch, unknown events) always runs them - fail-open, since
    # a silently skipped harness is what let the #297 regression ship.
    changes:
        runs-on: ubuntu-latest
        outputs:
            lock: ${{ steps.diff.outputs.lock }}
        env:
            GH_TOKEN: ${{ github.token }}
            BASE_SHA: ${{ github.event.pull_request.base.sha }}
            BEFORE_SHA: ${{ github.event.before }}
        steps:
            - name: detect-lock-workflow-changes
              id: diff
              run: |
                  RANGE=""
                  if [ -n "$BASE_SHA" ]; then
                      RANGE="$BASE_SHA...$GITHUB_SHA"
                  elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
                      RANGE="$BEFORE_SHA...$GITHUB_SHA"
                  fi
                  LOCK=true
                  if [ -n "$RANGE" ]; then
                      LOCK=false
                      FILES=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${RANGE}" --jq '.files[].filename' 2>/dev/null)
                      if [ -z "$FILES" ]; then
                          # Compare failed (unknown range, force-push, ...) - run rather than skip.
                          echo "compare failed for $RANGE - running harnesses"
                          LOCK=true
                      elif echo "$FILES" | grep -qE '^\.github/workflows/(shared-lock|shared-unlock|test-shared-lock|test-shared-lock-contract|test-shared)\.yml$'; then
                          LOCK=true
                      fi
                      echo "changed files matching gate: $(echo "$FILES" | grep -E '^\.github/workflows/' || echo none)"
                  fi
                  echo "lock=$LOCK" >> "$GITHUB_OUTPUT"

    affected-projects:
        name: affected-projects
        uses: ./.github/workflows/test-shared-affected-projects.yml

    semantic-release:
        name: semantic-release
        uses: ./.github/workflows/test-shared-semantic-release.yml
        secrets:
            ZERV_SANDBOX_REPO_TOKEN: ${{ secrets.ZERV_SANDBOX_REPO_TOKEN }}

    check-marker:
        name: check-marker
        uses: ./.github/workflows/test-shared-check-marker.yml

    pr-label-checks:
        name: pr-label-checks
        uses: ./.github/workflows/test-shared-pr-label-checks.yml

    # Poll/wait harness for shared-lock.yml. Chain reaches only 3 levels
    # (ci/cd -> this -> test-shared-lock -> shared-lock), so it fits here -
    # unlike the global/service-lock harnesses, whose chains already reach 4.
    # Keep this wired: the harness was dispatch-only when the #297 poll rewrite
    # shipped, and nothing in CI objected to a caller-breaking change.
    lock-poll:
        name: lock-poll
        needs: changes
        if: needs.changes.outputs.lock == 'true'
        uses: ./.github/workflows/test-shared-lock.yml

    # Cross-repo contract test: runs shared-lock round-trip in zerv-sandbox
    # against this ref. Catches caller-visible regressions before callers do.
    lock-contract:
        name: lock-contract
        needs: changes
        if: needs.changes.outputs.lock == 'true'
        uses: ./.github/workflows/test-shared-lock-contract.yml
        secrets:
            ZERV_SANDBOX_REPO_TOKEN: ${{ secrets.ZERV_SANDBOX_REPO_TOKEN }}
