name: build-bin

on:
    workflow_call:
        inputs:
            version:
                description: "Version to set in Cargo.toml (e.g., '1.0.0'). If not provided, version update is skipped"
                type: string
                required: false
            tag:
                description: "Git tag for release upload (e.g., 'v1.0.0'). Only used when upload_to_release is true"
                type: string
                required: false
            upload_to_release:
                description: "Whether to upload binaries to GitHub release"
                type: boolean
                required: false
                default: false

jobs:
    build-bin:
        name: build-bin-${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: linux-x64
                      os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                      artifact_name: zerv
                      asset_name: zerv-x86_64-unknown-linux-gnu
                    - name: linux-arm64
                      os: ubuntu-latest
                      target: aarch64-unknown-linux-gnu
                      artifact_name: zerv
                      asset_name: zerv-aarch64-unknown-linux-gnu
                    - name: macos-x64
                      os: macos-latest
                      target: x86_64-apple-darwin
                      artifact_name: zerv
                      asset_name: zerv-x86_64-apple-darwin
                    - name: macos-arm64
                      os: macos-latest
                      target: aarch64-apple-darwin
                      artifact_name: zerv
                      asset_name: zerv-aarch64-apple-darwin
                    - name: windows-x64
                      os: windows-latest
                      target: x86_64-pc-windows-msvc
                      artifact_name: zerv.exe
                      asset_name: zerv-x86_64-pc-windows-msvc.exe
                    - name: windows-arm64
                      os: windows-latest
                      target: aarch64-pc-windows-msvc
                      artifact_name: zerv.exe
                      asset_name: zerv-aarch64-pc-windows-msvc.exe

        steps:
            - name: checkout-repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: setup-mise
              uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

            - name: verify-rust-toolchain
              # Workaround for Windows rustup bug: https://github.com/rust-lang/rustup/issues/3104
              shell: bash
              run: |
                  if ! cargo --version &>/dev/null; then
                    TOOLCHAIN=$(rustup show active-toolchain | head -1 | cut -d' ' -f1)
                    rustup toolchain uninstall "$TOOLCHAIN" || true
                    rustup toolchain install "$TOOLCHAIN" --no-self-update
                  fi
                  cargo --version

            - name: install-target
              shell: bash
              run: rustup target add ${{ matrix.target }}

            - name: install-cross-compilation-dependencies
              if: matrix.target == 'aarch64-unknown-linux-gnu'
              shell: bash
              run: |
                  sudo apt-get update
                  sudo apt-get install -y gcc-aarch64-linux-gnu
                  echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

            - name: update-cargo-toml-version
              if: inputs.version != ''
              shell: bash
              run: |
                  bake version "${{ inputs.version }}"

            - name: build-binary
              run: cargo build --release --target ${{ matrix.target }}

            - name: upload-binary-to-release
              if: inputs.upload_to_release == true && inputs.tag != ''
              uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
              with:
                  repo_token: ${{ secrets.GITHUB_TOKEN }}
                  file: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
                  asset_name: ${{ matrix.asset_name }}
                  tag: ${{ inputs.tag }}
                  overwrite: true
