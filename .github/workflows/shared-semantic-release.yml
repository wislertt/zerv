name: semantic-release

on:
    workflow_call:
        inputs:
            allowed_workflow_dispatch_branches:
                description: "Comma-separated list of branches allowed for workflow dispatch"
                required: false
                default: '["main"]'
                type: string
            fail_on_invalid_workflow_dispatch_ref:
                description: "Whether to fail the workflow when the ref is invalid (only applies to workflow_dispatch)"
                required: false
                default: false
                type: boolean
            extra_plugins:
                description: "Additional semantic-release plugins/presets to install (e.g. 'conventional-changelog-conventionalcommits')"
                required: false
                default: "conventional-changelog-conventionalcommits"
                type: string
            dry_run:
                description: "Run semantic-release in dry-run mode (no actual release)"
                required: false
                default: false
                type: boolean
            event_name_override:
                description: "Override GITHUB_EVENT_NAME seen by semantic-release (empty = real event; lets tests simulate a push so release detection runs)"
                required: false
                default: ""
                type: string
            checkout_repository:
                description: "Repository to check out (empty = caller repository)"
                required: false
                default: ""
                type: string
            checkout_ref:
                description: "Ref to check out (empty = triggering ref)"
                required: false
                default: ""
                type: string

        secrets:
            checkout_token:
                description: "Token for actions/checkout when checkout_repository points at another repo (empty = default GITHUB_TOKEN)"
                required: false

        outputs:
            new_release_version:
                description: "The determined version. Empty when no release was published and the current commit has no v* tag"
                value: ${{ jobs.semantic-release.outputs.new_release_version }}
            new_release_published:
                description: "Whether a new release was published"
                value: ${{ jobs.semantic-release.outputs.new_release_published }}
            is_valid_semantic_release:
                description: "Whether semantic-release job was executed successfully (regardless of whether it published a release)"
                value: ${{ jobs.semantic-release.outputs.is_valid_semantic_release }}

permissions:
    contents: write
    issues: write
    pull-requests: write

jobs:
    validate-ref-for-workflow-dispatch:
        name: validate-ref-for-workflow-dispatch
        runs-on: ubuntu-latest
        if: github.event_name == 'workflow_dispatch'
        outputs:
            is_valid: ${{ steps.check-ref.outputs.is_valid }}
            tag_version: ${{ steps.check-ref.outputs.tag_version }}
        steps:
            - name: checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: validate-ref-tag-or-branch
              id: check-ref
              run: |
                  set -euo pipefail

                  # Extract ref name without prefix
                  REF="${{ github.ref }}"
                  REF_SOURCE="${REF#*/}"  # Remove 'refs/'
                  REF_KIND="${REF_SOURCE%%/*}"  # Get 'tags' or 'heads'
                  REF_NAME="${REF_SOURCE#*/}"  # Get actual name

                  echo "Ref type: $REF_KIND"
                  echo "Ref name: $REF_NAME"

                  # Initialize outputs
                  IS_VALID=false
                  TAG_VERSION=""

                  if [[ "$REF_KIND" == "tags" ]]; then
                      echo "Validating tag: $REF_NAME"

                      # Check semver format: v1.2.3
                      if [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                          echo "✓ Valid semver tag"
                          IS_VALID=true
                          TAG_VERSION="${REF_NAME#v}"  # Remove 'v' prefix
                      else
                          echo "✗ Invalid tag format. Expected: v1.2.3"
                      fi

                  elif [[ "$REF_KIND" == "heads" ]]; then
                      echo "Checking branch: $REF_NAME"

                      # Parse allowed branches from JSON
                      mapfile -t ALLOWED_BRANCHES < <(echo '${{ inputs.allowed_workflow_dispatch_branches }}' | jq -r '.[]')

                      # Check if branch matches any allowed pattern
                      for pattern in "${ALLOWED_BRANCHES[@]}"; do
                          if [[ "$REF_NAME" == "$pattern" ]]; then
                              echo "✓ Branch matches pattern: $pattern"
                              IS_VALID=true
                              break
                          fi
                      done

                      if [[ "$IS_VALID" != "true" ]]; then
                          echo "✗ Branch not in allowed list"
                          echo "Allowed patterns: $(IFS=', '; echo "${ALLOWED_BRANCHES[*]}")"
                      fi
                  else
                      echo "✗ Unknown ref type: $REF_KIND"
                  fi

                  # Set outputs
                  echo "is_valid=$IS_VALID" >> "$GITHUB_OUTPUT"
                  echo "tag_version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

                  # Fail if requested and ref is invalid
                  if [[ "${{ inputs.fail_on_invalid_workflow_dispatch_ref }}" == "true" && "$IS_VALID" != "true" ]]; then
                      echo "::error::Invalid ref detected and fail_on_invalid_workflow_dispatch_ref is enabled"
                      exit 1
                  fi

    semantic-release:
        name: semantic-release
        needs: validate-ref-for-workflow-dispatch
        if: always() && (github.event_name != 'workflow_dispatch' || (github.event_name == 'workflow_dispatch' && needs.validate-ref-for-workflow-dispatch.outputs.is_valid == 'true'))
        runs-on: ubuntu-latest
        outputs:
            new_release_version: ${{ steps.determine-version.outputs.new_release_version }}
            new_release_published: ${{ steps.determine-version.outputs.new_release_published }}
            is_valid_semantic_release: ${{ steps.is-valid.outputs.is_valid_semantic_release }}
        steps:
            - name: checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  repository: ${{ inputs.checkout_repository }}
                  ref: ${{ inputs.checkout_ref }}
                  token: ${{ secrets.checkout_token || github.token }}

            - id: release
              name: release
              uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
              with:
                  extra_plugins: ${{ inputs.extra_plugins }}
                  dry_run: ${{ inputs.dry_run }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITHUB_EVENT_NAME: ${{ inputs.event_name_override != '' && inputs.event_name_override || github.event_name }}

            - name: determine-version-from-release-or-tag
              id: determine-version
              env:
                  RELEASE_PUBLISHED: ${{ steps.release.outputs.new_release_published }}
                  RELEASE_VERSION: ${{ steps.release.outputs.new_release_version }}
              run: |
                  # Set the published status
                  echo "new_release_published=$RELEASE_PUBLISHED" >> "$GITHUB_OUTPUT"

                  if [ "$RELEASE_PUBLISHED" == "true" ]; then
                      # Use the new release version
                      echo "new_release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
                      echo "New release: $RELEASE_VERSION"
                      exit 0
                  fi

                  # No release published: fall back to a tag on the current commit
                  CURRENT_SHA=$(git rev-parse HEAD)
                  # Prefer an exact semver tag (e.g. v1.64.11)
                  EXISTING_TAG=$(git tag --points-at "$CURRENT_SHA" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
                  # Fall back to a moveable prefix tag (e.g. v1, v1.64)
                  if [ -z "$EXISTING_TAG" ]; then
                      EXISTING_TAG=$(git tag --points-at "$CURRENT_SHA" | grep -E '^v[0-9]+(\.[0-9]+)?$' | head -1 || true)
                  fi
                  if [ -n "$EXISTING_TAG" ]; then
                      echo "new_release_version=${EXISTING_TAG#v}" >> "$GITHUB_OUTPUT"
                      echo "Using existing tag: $EXISTING_TAG"
                  else
                      # No release and no tag on HEAD: not an error. Emit an
                      # empty version so consumers can decide what to do
                      # (e.g. skip versioning/tagging steps for this push).
                      echo "new_release_version=" >> "$GITHUB_OUTPUT"
                      echo "::notice::No release published and no tag on the current commit; new_release_version is empty"
                  fi

            - name: mark-as-valid-semantic-release
              id: is-valid
              if: always()
              run: |
                  if [ "${{ steps.determine-version.outcome }}" == "success" ]; then
                      echo "is_valid_semantic_release=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "is_valid_semantic_release=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: display-outputs
              run: |
                  echo "Version: ${{ steps.determine-version.outputs.new_release_version }}"
                  echo "Published: ${{ steps.determine-version.outputs.new_release_published }}"
