name: publish-crates

on:
    workflow_call:
        inputs:
            version:
                required: true
                type: string
        secrets:
            # pass token in empty string will be in dry-run mode
            CRATES_API_TOKEN:
                required: true

jobs:
    publish-crates:
        name: publish-crates
        runs-on: ubuntu-latest
        steps:
            - name: checkout-repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: setup-mise
              uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0

            - name: cache-publish
              env:
                  CACHE_KEY_PREFIX: publish-${{ github.workflow }}-${{ github.job }}-${{ runner.os }}
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cargo/bin/
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                      ~/.local/share/uv
                      ~/.cache/uv
                      ${{ github.workspace }}/target/
                      ${{ github.workspace }}/.venv
                  key: ${{ env.CACHE_KEY_PREFIX }}-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: |
                      ${{ env.CACHE_KEY_PREFIX }}-${{ github.run_id }}-
                      ${{ env.CACHE_KEY_PREFIX }}-

            - name: install-dependencies
              shell: bash
              run: |
                  uv sync --all-extras --all-groups --frozen
                  echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"

            - name: publish
              run: |
                  BAKE_PUBLISH_TOKEN=${{ secrets.CRATES_API_TOKEN }} \
                  bake publish \
                      --registry crates \
                      --version "${{ inputs.version }}"
